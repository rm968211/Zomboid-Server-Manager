name: Build and push images

on:
  schedule:
    - cron: '0 3 * * 0'  # weekly, Sunday midnight UTC
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Push the latest tag"
        type: boolean
        default: true
      force_version_tags:
        description: "Force overwrite semver version tags (e.g. 1.0.0, 1.0, 1)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in package.json: $VERSION" >&2
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if this version is already on Docker Hub
        id: published
        run: |
          if docker manifest inspect "${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server-manager:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # --- zomboid-server-manager ---

      - name: Extract metadata (zomboid-server-manager)
        id: meta-manager
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server-manager
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=sha
          flavor: |
            latest=${{ github.event_name != 'workflow_dispatch' || inputs.push_latest == 'true' }}

      # amd64 only. The manager runs on Hal (x86_64) and nothing pulls an arm64
      # image of it, but building one cost ~5 minutes every push: GitHub runners
      # are amd64, so the arm64 leg ran under QEMU, where `npm run build` took
      # 292s against 22s native. Add the platform back if something arm64 ever
      # needs to run the manager — but build the frontend once on
      # $BUILDPLATFORM and COPY it into both arches, since Vite output is
      # architecture-independent. The game-server image below still ships arm64.
      - name: Build and push zomboid-server-manager
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-manager.outputs.tags }}
          labels: ${{ steps.meta-manager.outputs.labels }}
          cache-from: type=gha,scope=zomboid-server-manager
          cache-to: type=gha,mode=max,scope=zomboid-server-manager

      # --- zomboid-server ---

      - name: Extract metadata (zomboid-server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.published.outputs.exists == 'false' || inputs.force_version_tags == 'true' }}
            type=sha
          flavor: |
            latest=${{ github.event_name != 'workflow_dispatch' || inputs.push_latest == 'true' }}

      - name: Build and push zomboid-server (arm64 staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-server/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server:arm64-staging
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=zomboid-server-arm64
          cache-to: type=gha,mode=max,scope=zomboid-server-arm64

      - name: Build and push zomboid-server (amd64 staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-server/Dockerfile.amd64
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server:amd64-staging
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=zomboid-server-amd64
          cache-to: type=gha,mode=max,scope=zomboid-server-amd64

      - name: Create multi-arch manifest for zomboid-server
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create --tag "$tag" \
              "${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server:arm64-staging" \
              "${{ secrets.DOCKERHUB_USERNAME }}/zomboid-server:amd64-staging"
          done <<< "${{ steps.meta-server.outputs.tags }}"
